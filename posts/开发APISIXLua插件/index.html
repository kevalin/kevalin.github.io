    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const btn = document.getElementById('mobile-menu-btn');
        const dropdown = document.getElementById('mobile-menu-dropdown');
        const iconOpen = document.getElementById('menu-icon-open');
        const iconClose = document.getElementById('menu-icon-close');
        
        let isOpen = false;
        
        if (btn) {
          btn.addEventListener('click', () => {
            isOpen = !isOpen;
            if (isOpen) {
              dropdown.classList.remove('opacity-0', 'translate-y-2', 'pointer-events-none');
              dropdown.classList.add('opacity-100', 'translate-y-0', 'pointer-events-auto');
              
              iconOpen.classList.add('hidden', 'scale-50', 'opacity-0');
              iconClose.classList.remove('hidden', 'scale-50', 'opacity-0');
              iconClose.classList.add('scale-100', 'opacity-100');
            } else {
              dropdown.classList.add('opacity-0', 'translate-y-2', 'pointer-events-none');
              dropdown.classList.remove('opacity-100', 'translate-y-0', 'pointer-events-auto');
              
              iconClose.classList.add('hidden', 'scale-50', 'opacity-0');
              iconOpen.classList.remove('hidden', 'scale-50', 'opacity-0');
              iconOpen.classList.add('scale-100', 'opacity-100');
            }
          });

          // Close dropdown when clicking outside
          document.addEventListener('click', (e) => {
            if (isOpen && !btn.contains(e.target) && !dropdown.contains(e.target)) {
              btn.click();
            }
          });
        }
    
        window.addEventListener('resize', () => {
          if(window.innerWidth >= 640 && isOpen) {
            btn.click();
          }
        });

        // Smart Auto-Hiding Navbar Handler
        const mainNav = document.getElementById('main-nav');
        let lastScrollY = window.scrollY;

        const handleNavScroll = () => {
          const currentScrollY = window.scrollY;
          if (isOpen) return;

          if (currentScrollY > 100 && currentScrollY > lastScrollY) {
            // Scrolling down -> hide navbar
            mainNav.classList.add('-translate-y-full', 'opacity-0', 'pointer-events-none');
            mainNav.classList.remove('translate-y-0', 'opacity-100', 'pointer-events-auto');
          } else {
            // Scrolling up or near top -> show navbar
            mainNav.classList.remove('-translate-y-full', 'opacity-0', 'pointer-events-none');
            mainNav.classList.add('translate-y-0', 'opacity-100', 'pointer-events-auto');
          }
          lastScrollY = currentScrollY;
        };

        window.addEventListener('scroll', handleNavScroll);

        // Back to Top Button Handler
        const backToTopBtn = document.getElementById('back-to-top-btn');
        if (backToTopBtn) {
          const toggleBackToTop = () => {
            if (window.scrollY > 100) {
              backToTopBtn.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
              backToTopBtn.classList.add('opacity-100', 'translate-y-0', 'pointer-events-auto');
            } else {
              backToTopBtn.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
              backToTopBtn.classList.remove('opacity-100', 'translate-y-0', 'pointer-events-auto');
            }
          };

          window.addEventListener('scroll', toggleBackToTop);
          toggleBackToTop();

          backToTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        }
      });
    </script>
